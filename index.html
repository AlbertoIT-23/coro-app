<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coro</title>
<meta name="theme-color" content="#1d5fb0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
  <header>
    <div class="row between">
      <h1>Coro</h1>
      <div class="lang" role="group" aria-label="Lingua / Language">
        <button class="lang-btn" data-lang="it">IT</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
    <p data-i18n="tagline">Ripeti una frase insieme a una voce e confronta la tua.</p>
  </header>

  <p id="https-warn" class="note warn" data-i18n="httpsWarn" hidden></p>

  <section class="card">
    <h2 data-i18n="clip.title"></h2>
    <div class="row">
      <label class="btn primary"><span data-i18n="clip.upload"></span><input id="file" type="file" accept="audio/*,video/*" hidden></label>
      <button id="sample" class="btn" data-i18n="clip.sample"></button>
    </div>
    <div id="clip" hidden>
      <p id="clip-name" class="small"></p>
      <canvas id="editor" class="editor" data-i18n-aria="clip.editorAria"></canvas>
      <div class="row between">
        <span id="sel-info" class="small mono"></span>
        <span class="row tight">
          <button id="zoom" class="btn small-btn"></button>
          <button id="preview" class="btn small-btn" data-i18n="clip.listen"></button>
        </span>
      </div>
      <label class="block"><span data-i18n="clip.textLabel"></span> <span class="small" data-i18n="clip.textHint"></span>
        <input id="text" type="text" lang="zh" autocomplete="off" placeholder="你好吗">
      </label>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="setup.title"></h2>
    <fieldset class="modes">
      <legend class="sr" data-i18n="setup.modeLegend"></legend>
      <label><input type="radio" name="mode" value="together" checked><span><b data-i18n="mode.together"></b><span data-i18n="mode.togetherHint"></span></span></label>
      <label><input type="radio" name="mode" value="fade"><span><b data-i18n="mode.fade"></b><span data-i18n="mode.fadeHint"></span></span></label>
      <label><input type="radio" name="mode" value="after"><span><b data-i18n="mode.after"></b><span data-i18n="mode.afterHint"></span></span></label>
    </fieldset>
    <div class="fields">
      <label><span data-i18n="setup.amount"></span>
        <span class="row tight">
          <input id="amount" type="number" min="1" max="200" value="10" inputmode="numeric">
          <select id="unit"><option value="reps" data-i18n="setup.unitReps"></option><option value="min" data-i18n="setup.unitMin"></option></select>
        </span>
      </label>
      <label id="gap-row"><span data-i18n="setup.gap"></span>
        <select id="gap">
          <option value="0.25"></option>
          <option value="0.5" selected></option>
          <option value="1"></option>
          <option value="2"></option>
        </select>
      </label>
    </div>
    <p id="estimate" class="small"></p>
    <label class="block"><span data-i18n="setup.mic"></span>
      <select id="mic" disabled><option data-i18n="setup.micDefault"></option></select>
    </label>
    <button id="mic-ask" class="btn small-btn" data-i18n="setup.micAsk"></button>
    <p id="mic-warn" class="note warn" data-i18n="setup.micWarn" hidden></p>
    <label class="check"><input id="keep-all" type="checkbox"> <span data-i18n="setup.keepAll"></span> <span class="small" data-i18n="setup.keepHint"></span></label>
  </section>

  <section id="s-stage" class="card" hidden>
    <div class="row between">
      <h2 id="take-title"></h2>
      <button id="again" class="btn small-btn" data-i18n="stage.again" hidden></button>
    </div>
    <div class="chips" role="group" data-i18n-aria="stage.showAria">
      <button class="chip" data-view="pitch" data-i18n="view.pitch"></button>
      <button class="chip" data-view="waves" data-i18n="view.waves"></button>
      <button class="chip" data-view="spec" data-i18n="view.spec"></button>
      <button class="chip" data-view="advice" data-i18n="view.advice"></button>
      <button class="chip" data-view="ghost" data-i18n="view.ghost"></button>
    </div>

    <div id="takes-wrap" hidden>
      <div id="takes" class="takes" role="group" data-i18n-aria="stage.repsAria"></div>
      <p class="small" data-i18n="stage.soloHint"></p>
    </div>

    <div id="panel-advice" class="advice" hidden>
      <ul id="advice"></ul>
      <p id="advice-note" hidden></p>
      <p class="small" data-i18n="stage.adviceHint"></p>
    </div>

    <div id="panel-pitch" class="panel">
      <div class="legend">
        <span><i class="sw model"></i><span data-i18n="lane.model"></span></span>
        <span><i class="sw you"></i><span data-i18n="lane.you"></span></span>
        <span id="legend-ghost" hidden><i class="sw ghost"></i><span data-i18n="view.ghost"></span></span>
      </div>
      <canvas id="pitch" class="chart-pitch" data-i18n-aria="stage.pitchAria"></canvas>
      <p class="small" data-i18n="stage.cutsHint"></p>
      <p id="pitch-note" class="note" data-i18n="stage.pitchNote" hidden></p>
    </div>

    <div id="panel-waves" class="panel">
      <p class="lane" data-i18n="lane.model"></p>
      <canvas id="wave-model" class="chart-wave" data-i18n-aria="stage.waveModelAria"></canvas>
      <p class="lane" id="you-label"></p>
      <canvas id="wave-you" class="chart-wave" data-i18n-aria="stage.waveYouAria"></canvas>
    </div>

    <div id="panel-spec" class="panel">
      <p class="lane"><span data-i18n="lane.model"></span> <span class="small" data-i18n="lane.upTo"></span></p>
      <canvas id="spec-model" class="chart-spec" data-i18n-aria="stage.specModelAria"></canvas>
      <p class="lane" data-i18n="lane.you"></p>
      <canvas id="spec-you" class="chart-spec" data-i18n-aria="stage.specYouAria"></canvas>
    </div>

    <div id="play-row" class="row wrap" hidden>
      <button class="btn small-btn" data-play="model" data-i18n="lane.model"></button>
      <button class="btn small-btn" data-play="you" data-i18n="lane.you"></button>
      <button class="btn small-btn" data-play="turns" data-i18n="play.turns"></button>
      <button class="btn small-btn" data-play="ears" data-i18n="play.ears"></button>
      <button id="star" class="btn small-btn"></button>
      <button id="download" class="btn small-btn" data-i18n="stage.download"></button>
    </div>

    <label id="shift-row" class="block"><span data-i18n="stage.shift"></span> <span id="shift-value" class="mono">0 ms</span>
      <input id="shift" type="range" min="-400" max="400" step="10" value="0">
    </label>
  </section>

  <section id="s-history" class="card" hidden>
    <h2 data-i18n="history.title"></h2>
    <ul id="history" class="history"></ul>
    <p class="small" data-i18n="history.note"></p>
  </section>

  <details class="card">
    <summary data-i18n="diag.title"></summary>
    <p class="small" data-i18n="diag.hint"></p>
    <p id="level-warn" class="note warn" hidden></p>
    <dl id="diag" class="diag"></dl>
  </details>
</main>

<div class="bar">
  <p id="status" role="status" aria-live="polite"></p>
  <button id="start" class="btn primary"></button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
